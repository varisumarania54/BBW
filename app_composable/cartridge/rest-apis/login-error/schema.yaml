openapi: 3.0.0
info:
  version: 1.0.0
  title: Login Error Messaging
components:
  securitySchemes:
    ShopperToken:
      type: http
      scheme: bearer
      flows:
        authorizationCode:
          authorizationUrl: https://shortcode.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/my-org-id/oauth2/authorize
          tokenUrl: https://shortcode.api.commercecloud.salesforce.com/shopper/auth/v1/organizations/my-org-id/oauth2/token
          scopes:
            c_loginError_r: loginError
paths:
  /loginError:
    post:
      summary: "Post loginError"
      operationId: loginError
      parameters:
        - in: path
          name: apiName
          required: true
          schema:
            type: string
        - in: query
          name: siteId
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        content:
          'application/json':
            schema:
              type: object
              required:
              - c_email
              properties:
                c_email:
                  type: string
                  minimum: 1
                  maximum: 9999
      responses:
        200:
          description: Ok, Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: httpCode
                  isLocked:
                    type: boolean
                  remainingAttempts:
                    type: number
        400:
          description: Any Error, Input or Lookup errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  type:
                    type: string
                  detail:
                    type: string
        500:
          description: Server Issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  type:
                    type: string
                  detail:
                    type: string
security:
  - ShopperToken: ["c_loginError_r"]